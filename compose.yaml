services:
  postgres:
    image: postgres:18-alpine
    container_name: postgresql-sumup
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: beauty_salons_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql  
    restart: unless-stopped

volumes:
  postgres-data: